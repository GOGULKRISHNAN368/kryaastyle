<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#efe4d5">
  <meta name="description" content="Kryaa Style - Curated For Every Celebration. Luxury Indian designer occasionwear, sherwanis, kurtas and festive collections.">
  <title>Kryaa Style | Curated For Every Celebration</title>
  
  <link rel="icon" type="image/svg+xml" href="image/kyraastyle-logo.svg">
  <link rel="apple-touch-icon" href="logo.png">
  <link rel="stylesheet" href="kryaa-opening.css">
</head>
<body>

  <!-- Fullscreen Luxury Opening Screen (Pleasant Warm Champagne Silk Template) -->
  <main class="kryaa-fullscreen-stage" id="kryaaStage" role="main" aria-label="Kryaa Style Welcome Screen">
    
    <!-- Flowing Satin Drapery & Silk Folds -->
    <div class="kryaa-silk-waves" aria-hidden="true"></div>

    <!-- Centerpiece Brand Showcase -->
    <div class="kryaa-brand-showcase">
      
      <!-- Official Website Logo -->
      <img src="logo.png" alt="Kryaa Style" class="kryaa-official-logo" decoding="async">

      <!-- Refined Luxury Tagline -->
      <p class="kryaa-tagline">CURATED FOR EVERY CELEBRATION</p>

      <!-- Celestial Diamond / Sparkle Ornament -->
      <div class="kryaa-sparkle-ornament" aria-hidden="true">
        <div class="kryaa-sparkle-line"></div>
        <span class="kryaa-sparkle-star">✦</span>
        <div class="kryaa-sparkle-line"></div>
      </div>

    </div>

    <!-- Subtle tap hint -->
    <div class="kryaa-tap-hint" aria-hidden="true">Tap to enter</div>

  </main>

  <script src="kryaa-opening.js"></script>
</body>
</html>
