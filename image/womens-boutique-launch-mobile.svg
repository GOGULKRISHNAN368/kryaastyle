<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1050" role="img" aria-labelledby="title desc">
  <title id="title">Kryaa Style — The Woman’s Edit</title>
  <desc id="desc">A season of your own. Launching 25 October.</desc>
  <defs>
    <linearGradient id="shade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#26090b" stop-opacity="0"/>
      <stop offset=".4" stop-color="#26090b" stop-opacity=".48"/>
      <stop offset="1" stop-color="#26090b" stop-opacity=".98"/>
    </linearGradient>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
      <feOffset dy="2"/>
      <feComponentTransfer><feFuncA type="linear" slope=".48"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <image href="../static3.azafashions.com/uploads/landing_page_section_content_image/1790599568970wedding-stories-by-aza.jpg" x="-720" y="0" width="2952" height="1050" preserveAspectRatio="none"/>
  <rect width="1080" height="1050" fill="url(#shade)"/>
  <g text-anchor="middle" filter="url(#soft-shadow)">
    <text x="540" y="666" fill="#f2d99d" font-family="Arial, sans-serif" font-size="21" letter-spacing="7">KRYAA STYLE  ·  THE WOMAN’S EDIT</text>
    <path d="M330 710h165m90 0h165" stroke="#d4ac65" stroke-width="2"/>
    <path d="M540 696l13 14-13 14-13-14z" fill="#dfbd79"/>
    <text x="540" y="806" fill="#f3d18c" font-family="Georgia, 'Times New Roman', serif" font-size="75">A season of your own</text>
    <text x="540" y="862" fill="#fff7ed" font-family="Arial, sans-serif" font-size="23" letter-spacing="1">Modern heirlooms for every celebration</text>
    <rect x="292" y="913" width="496" height="72" rx="3" fill="none" stroke="#e0bd78" stroke-width="2"/>
    <text x="540" y="960" fill="#f2d99d" font-family="Arial, sans-serif" font-size="23" font-weight="600" letter-spacing="5">LAUNCHING 25 OCTOBER</text>
  </g>
</svg>
