<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#efe4d5">
  <meta name="description" content="Kyraa Style - Curated For Every Celebration. Luxury Indian designer occasionwear, sherwanis, kurtas and festive collections.">
  <title>Kyraa Style | Curated For Every Celebration</title>
  <link rel="stylesheet" href="kyraa-opening.css">
</head>
<body>
  <main class="kyraa-fullscreen-stage" id="kyraaStage" role="main" aria-label="Kyraa Style Welcome Screen">
    <div class="kyraa-silk-waves" aria-hidden="true"></div>

    <div class="kyraa-brand-showcase">
      <img src="logo.png" alt="Kyraa Style" class="kyraa-official-logo" decoding="async">
      <p class="kyraa-tagline">CURATED FOR EVERY CELEBRATION</p>

      <div class="kyraa-sparkle-ornament" aria-hidden="true">
        <div class="kyraa-sparkle-line"></div>
        <span class="kyraa-sparkle-star">✦</span>
        <div class="kyraa-sparkle-line"></div>
      </div>
    </div>

    <div class="kyraa-tap-hint" aria-hidden="true">Tap to enter</div>
  </main>

  <script src="kyraa-opening.js"></script>
</body>
</html>
