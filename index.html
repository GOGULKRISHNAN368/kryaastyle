<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#efe4d5">
  <meta name="description" content="KyraaStyle - Curated women's occasionwear including sarees, kurta sets, salwar suits and anarkalis.">
  <title>KyraaStyle | Curated For Every Celebration</title>
  
  <link rel="icon" type="image/png" href="store/images/favicon.png">
  <link rel="apple-touch-icon" href="store/images/favicon.png">
  <link rel="stylesheet" href="kyraa-opening.css">
</head>
<body>

  <!-- Fullscreen Luxury Opening Screen (Pleasant Warm Champagne Silk Template) -->
  <main class="kyraa-fullscreen-stage" id="kyraaStage" role="main" aria-label="Kyraa Style Welcome Screen">
    
    <!-- Flowing Satin Drapery & Silk Folds -->
    <div class="kyraa-silk-waves" aria-hidden="true"></div>

    <!-- Centerpiece Brand Showcase -->
    <div class="kyraa-brand-showcase">
      
      <!-- Official Website Logo -->
      <img src="image/kyraastyle-logo.svg" alt="KyraaStyle" class="kyraa-official-logo" decoding="async">

      <!-- Refined Luxury Tagline -->
      <p class="kyraa-tagline">CURATED FOR EVERY CELEBRATION</p>

      <!-- Celestial Diamond / Sparkle Ornament -->
      <div class="kyraa-sparkle-ornament" aria-hidden="true">
        <div class="kyraa-sparkle-line"></div>
        <span class="kyraa-sparkle-star">✦</span>
        <div class="kyraa-sparkle-line"></div>
      </div>

    </div>

    <!-- Subtle tap hint -->
    <div class="kyraa-tap-hint" aria-hidden="true">Tap to enter</div>

  </main>

  <script src="kyraa-opening.js"></script>
</body>
</html>
